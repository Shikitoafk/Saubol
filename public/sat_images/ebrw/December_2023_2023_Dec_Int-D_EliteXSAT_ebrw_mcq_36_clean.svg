<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550"><rect width="1100" height="550" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#171717}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.c{font-size:21px}.g{stroke:#333;stroke-width:2;fill:none}</style><text class="t" x="550" y="45" text-anchor="middle">Pyramids in Egypt and the Americas</text><rect class="g" x="25" y="75" width="1050" height="445"/><path class="g" d="M350 75v445M525 75v445M720 75v445M25 185h1050M25 269h1050M25 353h1050M25 437h1050"/><text class="h" x="187" y="137" text-anchor="middle">Pyramid</text><text class="h" x="437" y="137" text-anchor="middle">Country</text><text class="h" x="622" y="124" text-anchor="middle">Height</text><text class="h" x="622" y="150" text-anchor="middle">(meters)</text><text class="h" x="897" y="124" text-anchor="middle">Age (years before</text><text class="h" x="897" y="150" text-anchor="middle">present)</text><g class="c"><text x="45" y="235">The Bent Pyramid</text><text x="380" y="235">Egypt</text><text x="622" y="235" text-anchor="middle">105</text><text x="897" y="235" text-anchor="middle">4,500 to 4,600</text><text x="45" y="319">The Pyramid of Hawara</text><text x="380" y="319">Egypt</text><text x="622" y="319" text-anchor="middle">58</text><text x="897" y="319" text-anchor="middle">3,800 to 4,000</text><text x="45" y="403">The Great Pyramid</text><text x="380" y="403">Mexico</text><text x="622" y="403" text-anchor="middle">33</text><text x="897" y="403" text-anchor="middle">2,050 to 2,400</text><text x="45" y="487">The Nohoch Mul Pyramid</text><text x="380" y="487">Mexico</text><text x="622" y="487" text-anchor="middle">42</text><text x="897" y="487" text-anchor="middle">1,100 to 1,500</text></g></svg>
