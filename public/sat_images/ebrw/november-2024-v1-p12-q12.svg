<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Orientation of paired leaves table">
  <style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-weight:700}.cell{font-size:20px}.small{font-size:17px}.title{font-size:25px;font-weight:700}.grid{stroke:#273245;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="560" rx="18" fill="#fff"/>
  <text x="480" y="45" text-anchor="middle" class="title">Orientation of Paired Leaves in Grapevines and Related Species</text>
  <g transform="translate(36 76)"><rect width="888" height="400" class="grid"/><path d="M250 0V400M400 0V400M575 0V400M735 0V400M0 180H888M0 235H888M0 290H888M0 345H888" class="grid"/>
  <text x="125" y="150" text-anchor="middle" class="cell h">Species</text><text x="325" y="130" text-anchor="middle" class="cell h">Total leaf</text><text x="325" y="155" text-anchor="middle" class="cell h">pairs examined</text><text x="487" y="112" text-anchor="middle" class="cell h">Pairs with opposite-</text><text x="487" y="138" text-anchor="middle" class="cell h">side orientation</text><text x="655" y="112" text-anchor="middle" class="cell h">Pairs with same-side</text><text x="655" y="138" text-anchor="middle" class="cell h">orientation</text><text x="811" y="72" text-anchor="middle" class="small h">Ratio of opposite-side</text><text x="811" y="96" text-anchor="middle" class="small h">to same-side orientations</text><text x="811" y="120" text-anchor="middle" class="small h">(n to 1)</text>
  <g class="cell"><text x="125" y="215" text-anchor="middle" font-style="italic">Vitis × andersonii</text><text x="325" y="215" text-anchor="middle">10</text><text x="487" y="215" text-anchor="middle">9</text><text x="655" y="215" text-anchor="middle">1</text><text x="811" y="215" text-anchor="middle">9.00</text><text x="125" y="270" text-anchor="middle" font-style="italic">Vitis rupestris</text><text x="325" y="270" text-anchor="middle">303</text><text x="487" y="270" text-anchor="middle">201</text><text x="655" y="270" text-anchor="middle">102</text><text x="811" y="270" text-anchor="middle">1.97</text><text x="125" y="325" text-anchor="middle" font-style="italic">Vitis × novae-angliae</text><text x="325" y="325" text-anchor="middle">7</text><text x="487" y="325" text-anchor="middle">5</text><text x="655" y="325" text-anchor="middle">2</text><text x="811" y="325" text-anchor="middle">2.50</text><text x="125" y="380" text-anchor="middle" font-style="italic">Vitis riparia</text><text x="325" y="380" text-anchor="middle">843</text><text x="487" y="380" text-anchor="middle">646</text><text x="655" y="380" text-anchor="middle">197</text><text x="811" y="380" text-anchor="middle">3.28</text></g></g>
