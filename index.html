<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta
      name="description"
      content="IELTS practice for every skill and a sourced directory of education programs."
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Saubol — IELTS Practice & Programs</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Шрифты грузятся здесь, а не через @import в CSS: @import блокирует
      рендер, пока не скачается таблица стилей шрифта, и не умеет
      preconnect. Начертания перечислены только те, что реально
      используются в разметке (400/500/600/700/900) — раньше тянулись все
      девять весов Outfit плюс целый Inter, который нигде не применялся.

      Inter — текст и интерфейс, Manrope — крупные заголовки,
      Literata — тексты заданий SAT (читать длинные пассажи с засечками
      заметно легче, и это ближе к тому, как выглядит настоящий экзамен).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap"
      rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q55EQHMVCD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-Q55EQHMVCD");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
